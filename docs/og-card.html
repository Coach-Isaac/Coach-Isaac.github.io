<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex" />
<title>og-image source</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Source for public/og-image.png (1200x630). Screenshot this page at a 1200x630 viewport to regenerate. -->
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: linear-gradient(135deg, #1F3A5F 0%, #2A4D78 55%, #2F5A8A 100%);
    color: #ffffff;
    font-family: 'Inter', 'PingFang TC', 'Noto Sans TC', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 96px;
    box-sizing: border-box;
  }
  .circle { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.07); }
  .c1 { width: 420px; height: 420px; right: -120px; top: -160px; }
  .c2 { width: 260px; height: 260px; left: -90px; bottom: -120px; }
  .badge {
    align-self: flex-start;
    font-size: 22px; font-weight: 600; letter-spacing: 0.04em;
    padding: 10px 22px; border-radius: 999px;
    background: rgba(255,255,255,0.15);
  }
  h1 {
    margin: 30px 0 0;
    font-family: 'Noto Serif TC', serif; font-weight: 700;
    font-size: 72px; line-height: 1.25;
  }
  .rule { width: 72px; height: 5px; border-radius: 3px; background: #FF7A59; margin: 34px 0 26px; }
  .sub { font-size: 28px; font-weight: 500; opacity: 0.92; }
  .foot {
    position: absolute; left: 96px; right: 96px; bottom: 48px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .brand { font-family: 'Noto Serif TC', serif; font-size: 30px; font-weight: 700; }
  .brand span { color: #FF9F86; }
  .url { font-size: 22px; font-weight: 600; letter-spacing: 0.06em; opacity: 0.75; }
  .cta {
    position: absolute; right: 96px; top: 64px;
    background: #FF7A59; color: #1A1A1A;
    font-size: 24px; font-weight: 700;
    padding: 14px 28px; border-radius: 999px;
  }
</style>
</head>
<body>
  <div class="circle c1"></div>
  <div class="circle c2"></div>
  <span class="cta">預約初次會談</span>
  <span class="badge">🌿 ICF 認證培訓中的教練團隊</span>
  <h1>卡關了嗎？<br>教練陪你找到前進的方向</h1>
  <div class="rule"></div>
  <div class="sub">一杯咖啡、飲料或一本書的心意 · 45 分鐘 · 線上進行 · 中英雙語</div>
  <div class="foot">
    <span class="brand">Coach <span>Isaac</span></span>
    <span class="url">coach-isaac.github.io</span>
  </div>
</body>
</html>
