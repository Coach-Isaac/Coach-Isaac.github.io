<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex" />
<title>og-image source</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap" rel="stylesheet">
<!-- Source for public/og-image.png (1200x630). Screenshot this page at a 1200x630 viewport to regenerate.
     Fixed brand colors (the dark badge in docs/design-spec.md): share images ignore the visitor's theme. -->
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #1F3A5F;
    color: #FFFFFF;
    font-family: 'Inter', 'PingFang TC', 'Noto Sans TC', sans-serif;
    padding: 72px 96px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .logo { display: flex; align-items: center; gap: 28px; }
  .logo svg { width: 92px; height: 92px; }
  .words { display: flex; align-items: center; gap: 22px; }
  .en { font-weight: 700; font-size: 55px; letter-spacing: -0.025em; }
  .sep { width: 2px; height: 46px; background: #C7CED7; opacity: 0.55; }
  .zh { font-family: 'PingFang TC', 'Noto Sans TC', sans-serif; font-weight: 600; font-size: 39px; letter-spacing: 0.14em; color: #C7CED7; }
  .text { display: flex; flex-direction: column; gap: 18px; }
  h1 { margin: 0; font-family: 'PingFang TC', 'Noto Sans TC', sans-serif; font-size: 68px; font-weight: 700; line-height: 1.2; }
  .sub { margin: 0; font-family: 'PingFang TC', 'Noto Sans TC', sans-serif; font-size: 36px; font-weight: 500; color: #C7CED7; }
  .line { margin: 0; padding-top: 22px; border-top: 2px solid #62758F; font-size: 26px; font-weight: 600; letter-spacing: 0.04em; color: #C7CED7; }
</style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <rect x="5" y="44" width="15" height="15" rx="3.5" fill="#8FB3E0"/>
      <rect x="24.5" y="24.5" width="15" height="15" rx="3.5" fill="#8FB3E0"/>
      <rect x="44" y="5" width="15" height="15" rx="3.5" fill="#FF8C6E"/>
      <g fill="none" stroke="#5D7DA6" stroke-width="2.4">
        <rect x="45.25" y="25.75" width="12.5" height="12.5" rx="3.5"/>
        <rect x="25.75" y="45.25" width="12.5" height="12.5" rx="3.5"/>
        <rect x="45.25" y="45.25" width="12.5" height="12.5" rx="3.5"/>
      </g>
    </svg>
    <div class="words"><span class="en">Stepflect</span><span class="sep"></span><span class="zh">進一程</span></div>
  </div>
  <div class="text">
    <h1>前進，不只有一種方式。</h1>
    <p class="sub">在你重視的事情上，有所進展。</p>
  </div>
  <p class="line">一對一教練式對話・Coaching</p>
</body>
</html>
